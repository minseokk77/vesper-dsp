name: Website CI

on:
  push:
    branches: ["master"]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
