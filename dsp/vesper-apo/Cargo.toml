[package]
name = "vesper-apo"
version = "0.0.25"
edition = "2021"
description = "Vesper Pure Rust Windows Audio Processing Object (APO) Engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
biquad = "0.6.0"
once_cell = "1.21.4"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
